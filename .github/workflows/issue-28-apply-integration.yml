name: Apply Issue 28 integration patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'codex/issue-28-perception-runs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-28-perception-runs
      - name: Apply deterministic integration patch
        run: python .github/scripts/apply_issue28_integration.py
      - name: Commit integration and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_issue28_integration.py
          git rm .github/workflows/issue-28-apply-integration.yml
          git add src/video_vault/ui.py src/video_vault/project.py
          git commit -m "feat: integrate persistent project perception runs"
          git push
