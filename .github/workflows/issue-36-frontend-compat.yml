name: Apply Issue 36 frontend compatibility patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'codex/issue-36-user-summary-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-36-user-summary-provenance
      - name: Apply frontend compatibility patch
        run: python .github/scripts/apply_issue36_frontend_compat.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_issue36_frontend_compat.py
          git rm .github/workflows/issue-36-frontend-compat.yml
          git add web/tests/pr52-gate1-final.test.tsx
          git commit -m "test: update clip summary mutation contract"
          git push
