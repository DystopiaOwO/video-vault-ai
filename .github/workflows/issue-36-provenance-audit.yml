name: Apply Issue 36 provenance audit patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'codex/issue-36-user-summary-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-36-user-summary-provenance
      - name: Apply provenance audit accuracy patch
        run: python .github/scripts/apply_issue36_provenance_audit.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_issue36_provenance_audit.py
          git rm .github/workflows/issue-36-provenance-audit.yml
          git add src/video_vault/project.py
          git commit -m "fix: record only applied story guidance"
          git push
