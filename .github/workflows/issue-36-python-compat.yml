name: Apply Issue 36 Python compatibility patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'codex/issue-36-user-summary-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-36-user-summary-provenance
      - name: Apply Python compatibility patch
        run: python .github/scripts/apply_issue36_python_compat.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_issue36_python_compat.py
          git rm .github/workflows/issue-36-python-compat.yml
          git add tests/test_media_ownership.py tests/test_project.py
          git commit -m "test: update summary provenance expectations"
          git push
