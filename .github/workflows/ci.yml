name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        type: choice
        default: full
        options:
          - core
          - non-media
          - media-smoke
          - media
          - full

concurrency:
  group: video-vault-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    name: Select PR test layers
    runs-on: ubuntu-latest
    if: always()
    outputs:
      fallback_non_media: ${{ steps.plan.outputs.fallback_non_media }}
      media_smoke: ${{ steps.plan.outputs.media_smoke }}
      targeted_tests: ${{ steps.plan.outputs.targeted_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select changed-file tests
        id: plan
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/select_pr_tests.py \
              --base "$PR_BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            {
              echo "fallback_non_media=false"
              echo "media_smoke=false"
              echo "targeted_tests="
            } >> "$GITHUB_OUTPUT"
            echo "Non-PR event: selector is not needed; suite is controlled by event/mode."
          fi

  python:
    name: ${{ matrix.platform_label }} / ${{ github.event_name == 'pull_request' && 'PR Core/Targeted' || github.event_name == 'push' && 'Core Full' || github.event_name == 'schedule' && 'Scheduled Full' || inputs.suite }} / Python ${{ matrix.python-version }}
    needs: select
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'media-smoke'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
            platform_label: Windows authoritative
          - os: ubuntu-latest
            python-version: "3.13"
            platform_label: Ubuntu portability
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'media' || inputs.suite == 'full')))
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install FFmpeg on Ubuntu manual media suite
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.suite == 'media'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Verify media tools
        if: (runner.os == 'Windows' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'media' || inputs.suite == 'full')))) || (runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.suite == 'media')
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Verify Python UI import
        run: python -c "import video_vault.ui"

      - name: Run PR Core
        if: github.event_name == 'pull_request' && (runner.os == 'Windows' || needs.select.outputs.fallback_non_media != 'true')
        run: pytest -q -m "pr_core and not media_smoke and not media_e2e"
      - name: Run PR Targeted fallback
        if: github.event_name == 'pull_request' && runner.os == 'Linux' && needs.select.outputs.fallback_non_media == 'true'
        run: pytest -q -m "not media_smoke and not media_e2e"
      - name: Run PR Targeted tests
        if: github.event_name == 'pull_request' && runner.os == 'Linux' && needs.select.outputs.fallback_non_media != 'true' && needs.select.outputs.targeted_tests != ''
        shell: bash
        env:
          TARGETED_TESTS: ${{ needs.select.outputs.targeted_tests }}
        run: pytest -q -m "not pr_core and not media_smoke and not media_e2e" $TARGETED_TESTS

      - name: Run selected manual core suite
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'core'
        run: pytest -q -m "pr_core and not media_smoke and not media_e2e"
      - name: Run selected manual non-media suite
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'non-media'
        run: pytest -q -m "not media_smoke and not media_e2e"
      - name: Run selected manual media suite
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'media' && runner.os == 'Windows'
        run: pytest -q -m media_e2e
      - name: Run Ubuntu portable suite for push, schedule, and full manual runs
        if: runner.os == 'Linux' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full'))
        run: pytest -q -m "not media_smoke and not media_e2e"
      - name: Run Windows authoritative full suite
        if: runner.os == 'Windows' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full'))
        run: pytest -q

      - name: Check source encoding
        run: python scripts/check_encoding.py
      - name: Check pull request or push diff whitespace
        if: runner.os == 'Linux'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA:-}"
            head="${GITHUB_SHA}"
          else
            base="${PUSH_BEFORE_SHA:-}"
            head="${GITHUB_SHA}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid comparison base; skipping diff check."
            exit 0
          fi
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "Invalid comparison base; skipping diff check: $base"
            exit 0
          fi
          git diff --check "$base...$head"

  media-smoke:
    name: Media Smoke / Ubuntu
    needs: select
    if: (github.event_name == 'pull_request' && needs.select.outputs.media_smoke == 'true') || (github.event_name == 'workflow_dispatch' && inputs.suite == 'media-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Run tiny media smoke
        run: pytest -q -m media_smoke

  frontend:
    name: Frontend
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
