name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: video-vault-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Verify Python UI import
        run: python -c "import video_vault.ui"
      # Pull requests keep fast feedback by excluding tests that invoke real
      # FFmpeg pipelines. The complete suite still runs on main and manually.
      - name: Run pytest (PR fast suite)
        if: github.event_name == 'pull_request'
        run: pytest -q -m "not media_e2e"
      - name: Run pytest (full suite)
        if: github.event_name != 'pull_request'
        run: pytest -q
      - name: Check source encoding
        run: python scripts/check_encoding.py
      - name: Check pull request or push diff whitespace
        if: runner.os == 'Linux'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE_SHA:-}"
            head="${GITHUB_SHA}"
          else
            base="${PUSH_BEFORE_SHA:-}"
            head="${GITHUB_SHA}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid comparison base; skipping diff check."
            exit 0
          fi
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "Invalid comparison base; skipping diff check: $base"
            exit 0
          fi
          git diff --check "$base...$head"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
