name: Apply Issue 38 revision patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'codex/issue-38-project-revision-locks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-38-project-revision-locks
      - name: Apply project revision patch
        run: python .github/scripts/apply_issue38_revision.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_issue38_revision.py
          git rm .github/workflows/issue-38-revision-patch.yml
          git add src/video_vault/database.py src/video_vault/ui.py web/src/api.ts
          git commit -m "feat: enforce project revision conflicts on mutations"
          git push
