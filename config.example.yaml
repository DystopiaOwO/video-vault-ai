library_root: "D:/VideoLibrary"
inbox_dir: "00_inbox"
frame_interval_seconds: 5
frame_height: 720
proxy_height: 1080
default_ingest_mode: "copy"
ffmpeg_path: "ffmpeg"
ffprobe_path: "ffprobe"

ai:
  provider: "mock"
  local:
    ollama_url: "http://localhost:11434"
    model: "gemma4:12b"
  cloud:
    provider: "openai"
    model: "gpt-4.1-mini"
    api_key_env: "OPENAI_API_KEY"
