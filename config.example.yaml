library_root: "D:/VideoLibrary"
inbox_dir: "00_inbox"
frame_interval_seconds: 5
frame_height: 720
proxy_height: 1080
default_ingest_mode: "copy"
ffmpeg_path: "ffmpeg"
ffprobe_path: "ffprobe"

sampling:
  policy_name: "adaptive-balanced"
  policy_version: 1
  mode: "adaptive"
  preset: "balanced"
  baseline_interval_seconds: 5
  prescan_interval_seconds: 0.5
  dense_interval_seconds: 1
  scene_threshold: 0.32
  motion_threshold: 0.06
  min_interval_seconds: 0.25
  max_frames_per_clip: 180
  max_frames_per_minute: 30
  visual_dedupe_threshold: 0.985

render:
  max_concurrent_jobs: 1
  minimum_free_disk_bytes: 0
  # Optional. If omitted, a supported local system font is fingerprinted into
  # each approval snapshot before title-card composition.
  visual_font_path: ""

ai:
  provider: "mock"
  local:
    # Canonical OpenAI-compatible endpoint. Legacy lmstudio_url remains accepted.
    base_url: "http://127.0.0.1:1234/v1"
    model: "gemma4:12b"
  cloud:
    provider: "openai"
    model: "gpt-4.1-mini"
    api_key_env: "OPENAI_API_KEY"
