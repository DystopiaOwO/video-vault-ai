[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-vault-ai"
version = "0.1.0"
description = "Local Windows video asset vault with metadata, proxies, frames, and mock AI analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "pr_core: high-signal tests required on every pull request",
    "media_smoke: tiny real FFmpeg pipeline checks",
    "media_e2e: tests that invoke real FFmpeg/FFprobe media pipelines",
]
